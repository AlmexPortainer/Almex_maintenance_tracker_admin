name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ============================================================
  # 1) BUILD: se construye la imagen en runner de GitHub (cloud)
  #    y se publica en GHCR. El server NO construye nada.
  # ============================================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalizar nombre de imagen a minúsculas
        id: meta
        run: |
          IMAGE_LC=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')
          echo "image_lc=${IMAGE_LC}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_LC}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.image_lc }}:latest
            ${{ steps.meta.outputs.image_lc }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 2) DEPLOY: corre en el self-hosted runner DENTRO del server.
  #    No requiere webhook: el runner hace long-poll saliente a
  #    GitHub y ejecuta el deploy localmente con docker directo.
  # ============================================================
  deploy:
    needs: build
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en GHCR (para pull de imagen privada)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy stack
        env:
          # Ruta al .env de producción persistente en el server.
          ENV_FILE: ${{ secrets.PROD_ENV_PATH }}
          APP_IMAGE: ${{ needs.build.outputs.image_ref }}
        run: |
          set -e
          COMPOSE="docker compose -f docker-compose.portainer.yml --env-file ${ENV_FILE}"

          echo ">> Pull de la imagen ${APP_IMAGE}"
          APP_IMAGE=${APP_IMAGE} ${COMPOSE} pull

          echo ">> Levantando stack"
          APP_IMAGE=${APP_IMAGE} ${COMPOSE} up -d --remove-orphans

          echo ">> Migraciones"
          APP_IMAGE=${APP_IMAGE} ${COMPOSE} exec -T app php artisan migrate --force

          echo ">> Limpieza de imágenes viejas"
          docker image prune -f
