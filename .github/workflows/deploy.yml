name: Build & Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ============================================================
  # 1) BUILD: se construye la imagen en runner de GitHub (cloud)
  #    y se publica en GHCR. El server NO construye nada.
  # ============================================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular nombre y tags de imagen
        id: meta
        run: |
          IMAGE_LC=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')
          # Tag inmutable por commit + tag por rama (dev/main)
          TAGS="${IMAGE_LC}:${GITHUB_SHA}
          ${IMAGE_LC}:${GITHUB_REF_NAME}"
          # 'latest' solo en main
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS="${TAGS}
          ${IMAGE_LC}:latest"
          fi
          {
            echo "image_ref=${IMAGE_LC}:${GITHUB_SHA}"
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 2) DEPLOY: corre en el self-hosted runner DENTRO del server.
  #    Sin webhook: el runner hace long-poll saliente a GitHub.
  #    El .env de producción viene de un secreto de GitHub, así
  #    que NO hay que tocar el server para cambiar config.
  # ============================================================
  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64, Portainer]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en GHCR (pull de imagen privada)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Escribir .env desde secreto
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: printf '%s\n' "$PROD_ENV_FILE" > "$RUNNER_TEMP/almex.env"

      - name: Deploy stack
        env:
          ENV_FILE: ${{ runner.temp }}/almex.env
          APP_IMAGE: ${{ needs.build.outputs.image_ref }}
        run: |
          set -e
          COMPOSE="docker compose -f docker-compose.portainer.yml --env-file ${ENV_FILE}"

          echo ">> Pull de la imagen ${APP_IMAGE}"
          APP_IMAGE=${APP_IMAGE} ${COMPOSE} pull

          echo ">> Levantando stack"
          APP_IMAGE=${APP_IMAGE} ${COMPOSE} up -d --remove-orphans

          echo ">> Migraciones"
          APP_IMAGE=${APP_IMAGE} ${COMPOSE} exec -T app php artisan migrate --force

          echo ">> Limpieza"
          docker image prune -f

      - name: Borrar .env temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/almex.env"
