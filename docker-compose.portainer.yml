# ============================================================
# Stack de PRODUCCIÓN para Portainer.
# La imagen se construye en GitHub Actions y se publica en GHCR.
# Aquí NO se construye nada: solo se hace pull de la imagen ya lista.
# Un único contenedor "app" corre nginx + php-fpm + queue + scheduler
# (vía supervisor). MySQL y Redis viven fuera (shared_network).
#
# La configuración se inyecta con env_file (el .env viene del secreto
# PROD_ENV_FILE que el workflow escribe como .env). Así SOLO se pasan
# las variables que existen en tu .env; las ausentes usan los defaults
# de Laravel en vez de quedar como cadena vacía (que rompe config).
# ============================================================

services:
  app:
    # Tag inyectado por el pipeline (APP_IMAGE). Por defecto: latest.
    image: ${APP_IMAGE:-ghcr.io/almexportainer/almex_maintenance_tracker_admin:latest}
    container_name: ${DOCKER_APP_CONTAINER:-almex_app}
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8083}:80"
    volumes:
      # Solo persistimos storage (uploads, logs). El código vive en la imagen.
      - app-storage:/var/www/html/storage
    networks:
      - almex_network
      - shared_almex_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  almex_network:
    name: almex_network
    driver: bridge
  shared_almex_network:
    external: true
    name: shared_network

volumes:
  app-storage:
    driver: local
