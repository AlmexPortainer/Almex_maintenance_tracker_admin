version: "3.9"

# ============================================================
# Stack de PRODUCCIÓN para Portainer.
# La imagen se construye en GitHub Actions y se publica en GHCR.
# Aquí NO se construye nada: solo se hace pull de la imagen ya lista.
# Un único contenedor "app" corre nginx + php-fpm + queue + scheduler
# (vía supervisor). MySQL y Redis viven fuera (shared_network).
# ============================================================

x-laravel-env: &laravel_env
  APP_NAME: ${APP_NAME}
  APP_ENV: ${APP_ENV}
  APP_KEY: ${APP_KEY}
  APP_DEBUG: ${APP_DEBUG}
  APP_TIMEZONE: ${APP_TIMEZONE}
  APP_URL: ${APP_URL}
  APP_LOCALE: ${APP_LOCALE}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE}
  APP_FAKER_LOCALE: ${APP_FAKER_LOCALE}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
  PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
  PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME}
  PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE}
  PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE}
  DB_CONNECTION: ${DB_CONNECTION}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  CACHE_STORE: ${CACHE_STORE}
  CACHE_PREFIX: ${CACHE_PREFIX}
  SESSION_DRIVER: ${SESSION_DRIVER}
  SESSION_LIFETIME: ${SESSION_LIFETIME}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT}
  SESSION_PATH: ${SESSION_PATH}
  SESSION_DOMAIN: ${SESSION_DOMAIN}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION}
  LOG_CHANNEL: ${LOG_CHANNEL}
  LOG_STACK: ${LOG_STACK}
  LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL}
  LOG_LEVEL: ${LOG_LEVEL}
  MAIL_MAILER: ${MAIL_MAILER}
  MAIL_HOST: ${MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME}
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK}
  REDIS_CLIENT: ${REDIS_CLIENT}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_DB: ${REDIS_DB}
  REDIS_CACHE_DB: ${REDIS_CACHE_DB}
  REDIS_QUEUE_DB: ${REDIS_QUEUE_DB}

services:
  app:
    # Tag inyectado por el pipeline (APP_IMAGE). Por defecto: latest.
    image: ${APP_IMAGE:-ghcr.io/almexportainer/almex_maintenance_tracker_admin:latest}
    container_name: ${DOCKER_APP_CONTAINER:-almex_app}
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      <<: *laravel_env
    ports:
      - "${APP_PORT:-8083}:80"
    volumes:
      # Solo persistimos storage (uploads, logs). El código vive en la imagen.
      - app-storage:/var/www/html/storage
    networks:
      - almex_network
      - shared_almex_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  almex_network:
    name: almex_network
    driver: bridge
  shared_almex_network:
    external: true
    name: shared_network

volumes:
  app-storage:
    driver: local
